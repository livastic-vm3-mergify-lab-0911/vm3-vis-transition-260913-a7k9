name: VM3 queue secret trust promotion

on:
  pull_request:

permissions:
  contents: read

jobs:
  secret-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run trusted repository script
        env:
          VM3_QUEUE_PROMOTION_CANARY: ${{ secrets.VM3_QUEUE_PROMOTION_CANARY }}
        run: bash ci/vm3-queue-secret-probe.sh
